<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#1D6FA5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B1F33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B1F33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1F33" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0, 217, 255, 0.05)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(0, 217, 255, 0.15)"/>
      <circle cx="0" cy="60" r="1.5" fill="rgba(0, 217, 255, 0.15)"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="100%" height="100%" fill="#0B1F33"/>

  <!-- Ambient Light Orbs -->
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  <rect width="100%" height="100%" fill="url(#grad2)"/>
  <rect width="100%" height="100%" fill="url(#grad3)"/>

  <!-- Tech Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Subtle Cyber Constellation Nodes & Connecting Lines -->
  <g stroke="rgba(0, 217, 255, 0.18)" stroke-width="1.2" fill="none">
    <path d="M 120 200 L 280 260 L 420 180 L 600 320" />
    <path d="M 1300 140 L 1480 240 L 1640 180 L 1800 300" />
    <path d="M 200 800 L 380 720 L 520 860 L 740 780" />
    <path d="M 1200 850 L 1380 760 L 1560 880 L 1750 820" />
  </g>
  <g fill="#00D9FF" opacity="0.6">
    <circle cx="120" cy="200" r="3"/>
    <circle cx="280" cy="260" r="4"/>
    <circle cx="420" cy="180" r="3.5"/>
    <circle cx="600" cy="320" r="4.5"/>
    <circle cx="1300" cy="140" r="3.5"/>
    <circle cx="1480" cy="240" r="4"/>
    <circle cx="1640" cy="180" r="3"/>
    <circle cx="1800" cy="300" r="5"/>
    <circle cx="200" cy="800" r="3.5"/>
    <circle cx="380" cy="720" r="4"/>
    <circle cx="520" cy="860" r="3"/>
    <circle cx="740" cy="780" r="5"/>
    <circle cx="1200" cy="850" r="4"/>
    <circle cx="1380" cy="760" r="3.5"/>
    <circle cx="1560" cy="880" r="4.5"/>
    <circle cx="1750" cy="820" r="3.5"/>
  </g>
</svg>
